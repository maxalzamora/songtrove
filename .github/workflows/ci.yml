name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and checks
    runs-on: ubuntu-24.04
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "1"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fail on model changes without a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django's system checks
        run: python manage.py check

      - name: Run the test suite with coverage
        run: pytest --cov=songs --cov=accounts --cov=config --cov-report=term-missing
