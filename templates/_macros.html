{% macro static_stars(rating) -%}
  {%- if rating -%}
    <span class="stars-static" role="img" aria-label="{{ rating }} out of 5 stars">
      {%- for i in range(1, 6) -%}
        <span{% if i <= rating %} class="on"{% endif %}>★</span>
      {%- endfor -%}
    </span>
  {%- else -%}
    <span class="unrated">Unrated</span>
  {%- endif -%}
{%- endmacro %}
