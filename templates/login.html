{% extends "base.html" %}

{% block title %}Log in · Songtrove{% endblock %}

{% block content %}
<section class="login-page">
  <div class="login-card">
    <p class="eyebrow">Private library</p>
    <h1>Log in</h1>
    <p class="lede">Your songs are only available after you sign in.</p>

    {% if error %}
      <p class="form-error" role="alert">{{ error }}</p>
    {% endif %}

    <form class="login-form" method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">

      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="login-help">Accounts are created by the library owner.</p>
  </div>
</section>
{% endblock %}
