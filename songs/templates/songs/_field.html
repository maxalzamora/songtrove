{% if field.errors %}
  <div class="field field--invalid">
{% else %}
  <div class="field">
{% endif %}
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}
    <p class="field__help">{{ field.help_text }}</p>
  {% endif %}
  {% for error in field.errors %}
    <p class="field__error">{{ error }}</p>
  {% endfor %}
</div>
