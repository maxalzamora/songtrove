services:
  - type: web
    name: songtrove
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SECRET_KEY
        generateValue: true
      - key: SONGTROVE_USERNAME
        value: songtrove
      - key: SONGTROVE_PASSWORD_HASH
        sync: false
      - key: SONGTROVE_DB
        value: /var/data/songtrove.db
      - key: SONGTROVE_SECURE_COOKIES
        value: "1"
    disk:
      name: songtrove-data
      mountPath: /var/data
      sizeGB: 1
